plugins {
    id 'java'
    // Loom for unobfuscated Minecraft (26.x+): no mappings, no "mod*" configurations
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.group

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Universal Graves (Modrinth maven)
    implementation "maven.modrinth:universal-graves:${project.graves_version}"

    // Libraries Universal Graves itself uses
    implementation "eu.pb4:sgui:${project.sgui_version}"
    implementation "eu.pb4:polymer-core:${project.polymer_version}"
    implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
